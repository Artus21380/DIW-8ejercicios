<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Galería de clases de WoW</title>
    <style>
        body{font-family:system-ui;margin:1rem}
        .grid{
            display:grid;
            gap:1rem;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        }
        figure{
            margin:0;
            border:1px solid #ddd;
            padding:.5rem;
            border-radius:4px
        }
        figure img{
            width:100%;
        }
        figcaption{
            text-align:center;
            margin-top:.4rem;
            font-size:.9rem;
            color:#555
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Volver</a>
        </nav>
    </header>
    <h1>Galería de World of Warcraft</h1>

    <section class="grid">

        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXH7cRjjF0Ns4m0YeP0VEICAQpsvR5lDFLRlWRS6Ku2y998fjJ-Ze5vl4G&s=10" alt="WoW-Forever">
            <figcaption>Imagen promocional de WoW - Forever</figcaption>
        </figure>

        <figure>
            <img src="https://blz-contentstack-images.akamaized.net/v3/assets/blt9c12f249ac15c7ec/blt806d59ff0b4e0508/6aa88158ad9209ba7f5629ef/rebirth_og.png" alt="Warcraft3">
            <figcaption>Imagen promocional de expansión - Warcraft III</figcaption>
        </figure>

        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9gD-DEJnjS6TjrEnK3MDimv6e7rG5XeihKu-j8ygUf2rFIJ5iH2TDXO94&s=10" alt="Logo-WoW">

        </figure>

            <img src="https://i.ytimg.com/vi/1yMOZlYqsnY/maxresdefault.jpg" alt="Juego-Mesa-WoW">
            <figcaption>Colaboración de D&D con World of Wacraft</figcaption>
        </figure>

        <figure>
            <img src="https://wowvendor.com/app/uploads/2026/09/WoW-The-Last-Titan-announcement.jpg" alt="LastTitan">
            <figcaption>Imagen promocional de la ultima expansión de la trilogía</figcaption>
        </figure>

        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTytDMrcIaeSPF2bSMf8M4Hxy_vu0WGd3K_ABUCsld489CEBXV4SAG1Bcw&s=10" alt="ArteConceptual">
